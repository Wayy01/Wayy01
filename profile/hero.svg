  <radialGradient id="fade" cx=".5" cy=".45" r=".65"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gridmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
