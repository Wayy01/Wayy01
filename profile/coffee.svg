<svg xmlns="http://www.w3.org/2000/svg" width="380" height="92" viewBox="0 0 380 92" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Buy me a coffee</title>
<desc id="desc">Animated Buy Me a Coffee button with a steaming cup, linking to buymeacoffee.com/ionmoisei72.</desc>
<style>

.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.steam { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
@keyframes steam { 0% { transform: translateY(5px); opacity: 0; } 35% { opacity: .75; } 100% { transform: translateY(-6px); opacity: 0; } }
.shine { animation: shine 4.5s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(-140px); } 45%,100% { transform: translateX(520px); } }
.beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%,40%,100% { transform: scale(1); } 15% { transform: scale(1.22); } 28% { transform: scale(1.08); } }
.glow { animation: glow 3s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .steam { opacity: .6; } }
</style>
<defs>
  <clipPath id="pill"><rect x="10" y="10" width="360" height="72" rx="36.0"/></clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect class="glow" x="16" y="18" width="348" height="64" rx="32.0" fill="#FFDD00" filter="url(#blur)"/>
<rect x="10" y="10" width="360" height="72" rx="36.0" fill="#FFDD00"/>
<g clip-path="url(#pill)"><g class="shine"><rect x="0" y="0" width="80" height="92" fill="url(#shine)" transform="skewX(-20)"/></g></g>
<rect x="10.75" y="10.75" width="358.5" height="70.5" rx="35.25" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>

<!-- cup -->
<g transform="translate(4 0)" stroke="#0d0d0d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <path class="steam" d="M53 38 c-3 -4 3 -6 0 -10"/>
  <path class="steam" style="animation-delay:.8s" d="M61 38 c-3 -4 3 -6 0 -10"/>
  <path class="steam" style="animation-delay:1.6s" d="M69 38 c-3 -4 3 -6 0 -10"/>
  <path d="M38 42 h38 l-4 24 a6 6 0 0 1 -6 5 h-18 a6 6 0 0 1 -6 -5 z" fill="#ffffff"/>
  <path d="M41 47 h32" stroke="#6f4e37" stroke-width="4"/>
  <path d="M75 47 h3 a6 6 0 0 1 0 12 h-5"/>
</g>
<text class="sans" x="100" y="56" font-size="25" font-weight="800" letter-spacing="-.3" fill="#0d0d0d">Buy me a coffee</text>
<path class="beat" d="M340 40 c0 -6 -9 -8 -11 -1 c-2 -7 -11 -5 -11 1 c0 7 11 13 11 13 c0 0 11 -6 11 -13 z" fill="#ff4d6d"/>

</svg>
