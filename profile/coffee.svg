<style>

.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.steam { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
@keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .6; } 100% { transform: translateY(-4px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .steam { opacity: .5; } }
</style>
