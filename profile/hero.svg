</g>
<g class="ph1">
  <text class="mono" x="134" y="327" font-size="18" fill="#fafafa" textLength="410.4" lengthAdjust="spacing">Full-stack developer · <tspan fill="#65a5ff">TypeScript</tspan> · <tspan fill="#cae9ff">Go</tspan></text>
  <g class="cv1"><rect class="cover" x="134" y="302" width="440" height="36" fill="#161616"/><rect class="blink" x="134" y="314" width="2" height="22" rx="1" fill="#cae9ff"/></g>
</g>
