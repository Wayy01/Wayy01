  <linearGradient id="name" x1="330" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#cae9ff"/><stop offset=".35" stop-color="#65a5ff"/><stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e95ab4"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 620 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="star" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
