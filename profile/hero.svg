<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Hey, I'm Wayy — Founder of Just Dashboard</title>
<desc id="desc">Animated banner: Wayy, full-stack developer and founder of Just Dashboard (just-dashboard.com), with the Just Dashboard logo orbiting and a command palette typing short phrases.</desc>
<style>

.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
.drift1 { animation: drift1 18s ease-in-out infinite; }
.drift2 { animation: drift2 22s ease-in-out infinite; }
.drift3 { animation: drift3 26s ease-in-out infinite; }
@keyframes drift1 { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(110px,50px); } }
@keyframes drift2 { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(-120px,-40px); } }
@keyframes drift3 { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(-60px,70px); } }
.tw { animation: twinkle 4s ease-in-out infinite; opacity: .15; }
@keyframes twinkle { 0%,100% { opacity: .12; } 50% { opacity: .9; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2s cubic-bezier(0,0,.2,1) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(2.8); opacity: 0; } }
.float { animation: float 6s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
.halo { transform-box: fill-box; transform-origin: center; animation: halo 5s ease-in-out infinite; }
@keyframes halo { 0%,100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.06); opacity: 1; } }
.shoot { animation: shoot 9s ease-in infinite; opacity: 0; }
@keyframes shoot { 0% { transform: translate(0px,0px); opacity: 0; } 3% { opacity: 1; } 12% { transform: translate(-520px,260px); opacity: 0; } 100% { transform: translate(-520px,260px); opacity: 0; } }
.blink { animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0px); opacity: 1; } }

@keyframes ph0 { 0% { opacity: 1; animation-timing-function: step-end; } 0.000% { opacity: 1; animation-timing-function: step-end; } 18.466% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
@keyframes cv0 { 0% { transform: translateX(0px); } 1.390% { transform: translateX(0px); animation-timing-function: steps(25, end); } 8.339% { transform: translateX(270.0px); } 15.090% { transform: translateX(270.0px); animation-timing-function: steps(25, end); } 17.274% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
.ph0 { animation: ph0 25.18s infinite; } .cv0 { animation: cv0 25.18s linear infinite; }
@keyframes ph1 { 0% { opacity: 0; animation-timing-function: step-end; } 18.466% { opacity: 1; animation-timing-function: step-end; } 41.681% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
@keyframes cv1 { 0% { transform: translateX(0px); } 19.855% { transform: translateX(0px); animation-timing-function: steps(38, end); } 30.419% { transform: translateX(410.4px); } 37.169% { transform: translateX(410.4px); animation-timing-function: steps(38, end); } 40.489% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
.ph1 { animation: ph1 25.18s infinite; } .cv1 { animation: cv1 25.18s linear infinite; }
@keyframes ph2 { 0% { opacity: 0; animation-timing-function: step-end; } 41.681% { opacity: 1; animation-timing-function: step-end; } 60.877% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
@keyframes cv2 { 0% { transform: translateX(0px); } 43.070% { transform: translateX(0px); animation-timing-function: steps(27, end); } 50.576% { transform: translateX(291.6px); } 57.327% { transform: translateX(291.6px); animation-timing-function: steps(27, end); } 59.685% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
.ph2 { animation: ph2 25.18s infinite; } .cv2 { animation: cv2 25.18s linear infinite; }
@keyframes ph3 { 0% { opacity: 0; animation-timing-function: step-end; } 60.877% { opacity: 1; animation-timing-function: step-end; } 81.900% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
@keyframes cv3 { 0% { transform: translateX(0px); } 62.267% { transform: translateX(0px); animation-timing-function: steps(32, end); } 71.162% { transform: translateX(345.6px); } 77.913% { transform: translateX(345.6px); animation-timing-function: steps(32, end); } 80.708% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
.ph3 { animation: ph3 25.18s infinite; } .cv3 { animation: cv3 25.18s linear infinite; }
@keyframes ph4 { 0% { opacity: 0; animation-timing-function: step-end; } 81.900% { opacity: 1; animation-timing-function: step-end; } 100.000% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
@keyframes cv4 { 0% { transform: translateX(0px); } 83.290% { transform: translateX(0px); animation-timing-function: steps(24, end); } 89.961% { transform: translateX(259.2px); } 96.712% { transform: translateX(259.2px); animation-timing-function: steps(24, end); } 98.809% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
.ph4 { animation: ph4 25.18s infinite; } .cv4 { animation: cv4 25.18s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cover { display: none; } .ph1 { opacity: 0; } .ph2 { opacity: 0; } .ph3 { opacity: 0; } .ph4 { opacity: 0; } }
</style>
<defs>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="418" rx="28"/></clipPath>
  <clipPath id="bar"><rect x="130" y="298" width="434" height="44"/></clipPath>
  <radialGradient id="b1"><stop offset="0" stop-color="#65a5ff" stop-opacity=".34"/><stop offset="1" stop-color="#65a5ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b2"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
