  <text class="mono" x="134" y="327" font-size="18" fill="#fafafa" textLength="259.2" lengthAdjust="spacing">Visit <tspan fill="#cae9ff">just-dashboard.com</tspan></text>
  <g class="cv4"><rect class="cover" x="134" y="302" width="440" height="36" fill="#161616"/><rect class="blink" x="134" y="314" width="2" height="22" rx="1" fill="#cae9ff"/></g>
</g>
  </g>
